name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A superseded head has nothing left to prove — cancel its run instead of
# letting it burn the minutes budget.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck + lint + tests + build. The vendored @kernel/sdk drift gate
      # (tests/kernel-sdk-vendor.test.ts: manifest contractHash == exported
      # KERNEL_CONTRACT_HASH) runs inside the test step.
      - name: Check
        run: pnpm check
