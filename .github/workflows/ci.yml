name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck + lint + tests + build. The vendored @kernel/sdk drift gate
      # (tests/kernel-sdk-vendor.test.ts: manifest contractHash == exported
      # KERNEL_CONTRACT_HASH) runs inside the test step.
      - name: Check
        run: pnpm check
