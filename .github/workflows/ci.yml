name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - bar-tone-menu

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck + lint + tests + build (the lint step is new with the
      # Stage 32 toolchain; the SDK contract-hash gate joins in Task 2 when
      # the vendored @kernel/sdk lands).
      - name: Check
        run: pnpm check
