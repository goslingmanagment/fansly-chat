name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A superseded PR head has nothing left to prove — cancel its run instead of
# letting it burn the minutes budget. Main runs always complete: that run is
# the only finished-check record its commit ever gets.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Repo variable CI_POOL=pc routes the first attempt to the self-hosted
    # runners on the owner's PC; anything else (or a re-run, in case the PC
    # died mid-run) goes to GitHub-hosted. Keep the job id: it is the
    # required status check.
    runs-on: ${{ vars.CI_POOL == 'pc' && github.run_attempt == '1' && fromJSON('["self-hosted","ci-pc"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # The action wipes its install folder first; PC runners share one
          # $HOME, so each job installs pnpm under its own runner temp.
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # The Actions cache only pays off on GitHub-hosted runners; the PC
          # uses its persistent pnpm store (see Install dependencies).
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

      - name: Install dependencies
        # pnpm keeps its store inside the (per-job) setup folder; on the PC
        # point it at a persistent store shared by all runners (safe for
        # concurrent installs, same filesystem as the work dirs).
        env:
          PNPM_PC_STORE: ${{ runner.environment == 'self-hosted' && '1' || '' }}
        run: |
          if [ -n "$PNPM_PC_STORE" ]; then export npm_config_store_dir="$HOME/.local/share/pnpm/store"; fi
          pnpm install --frozen-lockfile

      # typecheck + lint + tests + build. The vendored @kernel/sdk drift gate
      # (tests/kernel-sdk-vendor.test.ts: manifest contractHash == exported
      # KERNEL_CONTRACT_HASH) runs inside the test step.
      - name: Check
        run: pnpm check
