name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main

# A superseded PR head has nothing left to prove — cancel its run instead of
# letting it burn the minutes budget. Main runs always complete: that run is
# the only finished-check record its commit ever gets. Each push to main gets
# a group of its own (run_id): GitHub keeps only ONE pending run per group,
# so a shared ref group let a third quick push cancel the pending second one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Drafts spend no runner time. Ready starts the required check; converting
    # back to Draft cancels the old PR run through the same concurrency group.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Runners: GitHub-hosted only (owner, 2026-10-21) — the repository is
    # public, so they are free, and a public repository must never reach the
    # owner's PC: no job names a self-hosted label, and none is registered to
    # the repo. Keep the job id: it is the required status check.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Two commits deep: on a PR, GitHub's merge commit and its first parent,
      # the base branch's tip — the next step compares the two.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # A PR that changes only prose — Markdown in the root, docs/**/*.md,
      # .agentic/**, .claude/** — runs nothing: every step below is skipped
      # and the job ends green, so the required check still reports success.
      # (Why not paths-ignore: a workflow that does not start reports nothing,
      # and the PR would wait for its required check forever.) Markdown
      # anywhere else may be a build input or a test fixture and counts as
      # code. Pushes to main always run in full; any doubt is run=true, and
      # the steps test for "not false".
      - name: Does this change need the check?
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          run=true
          if git rev-parse -q --verify 'HEAD^2' > /dev/null && changed=$(git diff --name-only --no-renames 'HEAD^1' HEAD) && [ -n "$changed" ]; then
            run=false
            while IFS= read -r file; do
              case "$file" in
                docs/*.md | .agentic/* | .claude/*) ;;
                */*) run=true ;;
                *.md) ;;
                *) run=true ;;
              esac
              if [ "$run" = true ]; then echo "needs the check: $file"; break; fi
            done <<< "$changed"
          fi
          [ "$run" = true ] || echo 'prose only (root *.md, docs/**/*.md, .agentic, .claude): nothing to check'
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # pnpm version from package.json "packageManager". The action wipes its
      # install folder first, so it stays in runner temp.
      - name: Setup pnpm
        if: steps.scope.outputs.run != 'false'
        uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node
        if: steps.scope.outputs.run != 'false'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.run != 'false'
        run: |
          pnpm install --frozen-lockfile

      # typecheck + lint + tests + build. The vendored @kernel/sdk drift gate
      # (tests/kernel-sdk-vendor.test.ts: manifest contractHash == exported
      # KERNEL_CONTRACT_HASH) runs inside the test part.
      #
      # The parts of `pnpm check`, read from package.json at run time, with the
      # read-only ones side by side and the rest alone in chain order
      # (scripts/ci-parallel-check.mjs), using the runner's four vCPUs. exec:
      # on cancel or timeout the runner signals only the step's own process, so
      # node must be that process to stop the parts and print the logs they
      # wrote.
      - name: Check (typecheck + lint + test + build, parts in parallel)
        if: steps.scope.outputs.run != 'false'
        run: exec node scripts/ci-parallel-check.mjs
